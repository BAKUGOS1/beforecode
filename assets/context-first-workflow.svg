<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="BeforeCode context-first workflow diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="60" y="70" font-family="Inter, ui-sans-serif, system-ui, Arial" font-size="32" font-weight="800" fill="#0f172a">Context-first planning flow</text>
  <text x="60" y="105" font-family="Inter, ui-sans-serif, system-ui, Arial" font-size="18" fill="#475569">BeforeCode captures real product intent before generating implementation docs.</text>

  <g transform="translate(60 160)">
    <g>
      <rect width="180" height="112" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="32" cy="34" r="13" fill="#dbeafe"/>
      <text x="58" y="40" font-family="Inter, Arial" font-size="17" font-weight="800" fill="#0f172a">Idea</text>
      <text x="24" y="76" font-family="Inter, Arial" font-size="14" fill="#64748b">User describes what</text>
      <text x="24" y="96" font-family="Inter, Arial" font-size="14" fill="#64748b">they want to build.</text>
    </g>
    <path d="M198 56h54" stroke="#94a3b8" stroke-width="2"/>
    <path d="M252 56l-9-7v14z" fill="#94a3b8"/>

    <g transform="translate(270 0)">
      <rect width="180" height="112" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="32" cy="34" r="13" fill="#ede9fe"/>
      <text x="58" y="40" font-family="Inter, Arial" font-size="17" font-weight="800" fill="#0f172a">Context</text>
      <text x="24" y="76" font-family="Inter, Arial" font-size="14" fill="#64748b">Problem, users, MVP,</text>
      <text x="24" y="96" font-family="Inter, Arial" font-size="14" fill="#64748b">scope and stack.</text>
    </g>
    <path d="M468 56h54" stroke="#94a3b8" stroke-width="2"/>
    <path d="M522 56l-9-7v14z" fill="#94a3b8"/>

    <g transform="translate(540 0)">
      <rect width="180" height="112" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="32" cy="34" r="13" fill="#cffafe"/>
      <text x="58" y="40" font-family="Inter, Arial" font-size="17" font-weight="800" fill="#0f172a">Questions</text>
      <text x="24" y="76" font-family="Inter, Arial" font-size="14" fill="#64748b">Missing details are</text>
      <text x="24" y="96" font-family="Inter, Arial" font-size="14" fill="#64748b">marked as TBD.</text>
    </g>
    <path d="M738 56h54" stroke="#94a3b8" stroke-width="2"/>
    <path d="M792 56l-9-7v14z" fill="#94a3b8"/>

    <g transform="translate(810 0)">
      <rect width="180" height="112" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="32" cy="34" r="13" fill="#dcfce7"/>
      <text x="58" y="40" font-family="Inter, Arial" font-size="17" font-weight="800" fill="#0f172a">Docs</text>
      <text x="24" y="76" font-family="Inter, Arial" font-size="14" fill="#64748b">PRD, TRD, API, QA</text>
      <text x="24" y="96" font-family="Inter, Arial" font-size="14" fill="#64748b">and build handoff.</text>
    </g>
  </g>

  <rect x="60" y="326" width="1080" height="1" fill="#cbd5e1"/>
  <text x="60" y="368" font-family="SFMono-Regular, Consolas, monospace" font-size="18" fill="#334155">npm install -D beforecode  →  npx beforecode start  →  review docs/00-project-context.md</text>
</svg>
