name: Template or feature request
description: Propose a new template, checklist, guide, prompt, or example pack
title: "[Proposal]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Proposal type
      options:
        - Template
        - Checklist
        - Guide
        - AI prompt
        - Example pack
        - Repository improvement
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What planning gap does this solve, and who needs it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed content
      description: Describe sections, workflow, or expected output.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References or prior art
      description: Add authoritative or openly licensed references where relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing files and issues for a similar proposal.
          required: true
        - label: This proposal fits spec-first software planning.
          required: true
