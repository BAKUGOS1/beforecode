name: Bug or documentation issue
description: Report incorrect, inconsistent, broken, or unclear repository content
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve BeforeCode. Do not include confidential project data.
  - type: input
    id: location
    attributes:
      label: Affected file or link
      placeholder: templates/prd.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is incorrect, inconsistent, broken, or unclear.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected improvement
      description: Describe the correct or clearer result.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add non-sensitive examples, screenshots, or references if useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed private, customer, and credential data.
          required: true
