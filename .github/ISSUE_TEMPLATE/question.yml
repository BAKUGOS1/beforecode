name: Usage question
description: Ask how to use or adapt BeforeCode
labels: ["question"]
body:
  - type: input
    id: project
    attributes:
      label: Project type
      placeholder: SaaS, CRM, AI agent, mobile app, open source...
    validations:
      required: true
  - type: input
    id: document
    attributes:
      label: Document or workflow
      placeholder: PRD, TRD, database schema, AI handoff...
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to decide. Do not include confidential project data.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the Getting Started guide and existing examples.
          required: true
